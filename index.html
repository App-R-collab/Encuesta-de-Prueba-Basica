<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Survey Form</title>
</head>

<body>
  <h1 id="title">Encuesta de prueba</h1>
  <p id="description">La encuesta nos permite tomar de decisiones</p>
  <form id="survey-form">
    <label id="name-label" for="name">Nombre</label>
    <input id="name" type="text" placeholder="Ingresa tu Nombre" required><br>
    <label id="email-label" for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="Ingresa tu correo" required>
    <br>
    <label id="number-label" for="number">Número</label>
    <input type="number" id="number" min="10" max="300" placeholder="Ingresa un número">
    <br>
    <hr>
    <p>¿Tipo de vivienda?</p>
    <select id="dropdown">
      <option value="" disabled selected>Selecciona una opción</option>
      <option value="Propia">Propia</option>
      <option value="Alquilada">Alquilada</option>
    </select>
    <br>
    <hr>
    <p>Genero?</p>
    <input type="radio" name="grupo-opciones" value="opcion1">M
    <input type="radio" name="grupo-opciones" value="opcion2">F
    <br>
    <hr>
    <p>Tienes hijos?</p>
    <input value="Opcion1" type="checkbox">Si
    <input value="Opcion2" type="checkbox">No
    <br>
    <hr>
    <p>Observaciones.</p>
    <textarea placeholder="Deja tus comentarios Aqui..."></textarea>
    <input type="submit" id="submit" value="Enviar Formulario">
  </form>
</body>

</html>
